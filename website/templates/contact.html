<section id="contact" class="py-5 ">
    <div class="container bg-grey">

        <div class="row">
            <div class="col-lg-8">
                <h2 class="mb-3">Contact</h2>
                <p class="mb-4">
                    Donec ullamcorper nulla non metus auctor fringilla. Vestibulum id ligula porta felis
                    euismod semper. Praesent commodo cursus magna, vel scelerisque nisl consectetur.
                    Fusce dapibus, tellus ac cursus commodo.
                </p>
            </div>
        </div>

        <form>
            <div class="row">
                <div class="col-lg-7 offset-lg-2 border bg-white p-3 rounded">

                    <div class="row mb-3">
                        <label for="email" class="col-sm-3 col-form-label text-end">
                            <strong>Your E-mail</strong>
                        </label>
                        <div class="col-sm-9">
                            <input type="email" id="email" class="form-control" placeholder="Your email">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <label for="message" class="col-sm-3 col-form-label text-end">
                            <strong>Your message</strong>
                        </label>
                        <div class="col-sm-9">
                            <textarea id="message" rows="5" class="form-control"
                                      placeholder="Please enter your message here..."></textarea>
                        </div>
                    </div>

                    <div class="text-end">
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </div>

                </div>
            </div>
        </form>

    </div>
</section>
