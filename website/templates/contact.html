<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <div class="container mt-5">
    <h1>Contact</h1>

    <p class="lead">
      Donec ullamcorper nulla non metus auctor fringilla. Vestibulum id ligula porta felis euismod semper.
      Praesent commodo cursus magna, vel scelerisque nisl consectetur. Fusce dapibus, tellus ac cursus commodo.
    </p>

    <div class="bg-light border rounded p-3 mt-4 mx-auto" style="max-width: 800px;">
      <form>
        <div class="row mb-3">
          <label for="email" class="col-sm-3 col-form-label fw-bold text-end">
            Your E-mail
          </label>

          <div class="col-sm-9">
            <input 
              type="email" 
              class="form-control" 
              id="email" 
              placeholder="Your email"
            >
          </div>
        </div>

        <div class="row mb-3">
          <label for="message" class="col-sm-3 col-form-label fw-bold text-end">
            Your message
          </label>

          <div class="col-sm-9">
            <textarea 
              class="form-control" 
              id="message" 
              rows="5" 
              placeholder="Please enter your message here..."
            ></textarea>
          </div>
        </div>

        <div class="row">
          <div class="offset-sm-3 col-sm-9 text-end">
            <button type="submit" class="btn btn-primary btn-lg">
              Submit
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
